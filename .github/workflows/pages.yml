name: Publicar página institucional no GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/main/webapp/index.jsp'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    # Só publica depois que a URL do backend no Render estiver configurada.
    if: ${{ vars.ACTA_RENDER_URL != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Redirecionar ao site no servidor
        env:
          ACTA_RENDER_URL: ${{ vars.ACTA_RENDER_URL }}
        run: |
          set -eu
          if [ -z "$ACTA_RENDER_URL" ]; then
            echo "Configure a variável ACTA_RENDER_URL nas variáveis do repositório com a URL pública do Render."
            exit 1
          fi
          mkdir -p dist
          touch dist/.nojekyll
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          destino = os.environ["ACTA_RENDER_URL"].rstrip("/") + "/"
          url = urlsplit(destino)
          if url.scheme not in ("http", "https") or not url.netloc:
              raise ValueError("ACTA_RENDER_URL deve ser uma URL HTTP ou HTTPS válida.")
          destino = html.escape(destino, quote=True)
          pagina = f'''<!DOCTYPE html>
          <html lang="pt-BR"><head><meta charset="UTF-8">
          <meta http-equiv="refresh" content="0;url={destino}">
          <title>ACTA</title></head><body>
          <p><a href="{destino}">Acessar ACTA</a></p>
          </body></html>'''
          Path("dist/index.html").write_text(pagina, encoding="utf-8")
          PY

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
