<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/menu_lateral/logo_compacta.svg">
    <link rel="stylesheet" href="licoesaprendidas.css">
    <title>Lições Aprendidas</title>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar_logo">
                <img src="assets/menu_lateral/logo_original.svg" alt="logo ACTA">
            </div>

            <ul class="sidebar_nav">
                <li class="sidebar_item">
                <img src="assets/menu_lateral/simbolo_empresas.svg" alt="simbolo_empresas">
                    <span>Empresas</span>                    </li>
                <li class="sidebar_item">
                    <img src="assets/menu_lateral/simbolo_colaborador.svg" alt="simbolo_colaborador">
                    <span>Colaborador</span>
                </li>
                <li class="sidebar_item">
                    <img src="assets/menu_lateral/simbolo_administrador.svg" alt="simbolo_administrador">
                    <span>Administrador</span></li>
                <li class="sidebar_item">
                    <img src="assets/menu_lateral/simbolo_tarefa.svg" alt="simbolo_tarefa">
                    <span>Tarefa</span></li>
                <li class="sidebar_item">
                    <img src="assets/menu_lateral/simbolo_plano_de_acao.svg" alt="simbolo_plano_de_acao">
                    <span>Plano de ação</span></li>
                <li class="sidebar_item">
                    <img src="assets/menu_lateral/simbolo_ciclos.svg" alt="simbolo_ciclos">
                    <span>Ciclos</span>
                </li>
                <li class="sidebar_item sidebar_item-ativo" >
                    <img src="assets/menu_lateral/simbolo_licoes_aprendidas.svg" alt="simbolo_licoes_aprendidas">
                    <span>Lições Aprendidas</span>
                </li>
                <li class="sidebar_item">
                    <img src="assets/menu_lateral/simbolo_metas.svg" alt="simbolo_metas">
                    <span>Metas</span>
                </li>
                <li class="sidebar_item">
                    <img src="assets/menu_lateral/simbolo_problemas.svg" alt="simbolo_problemas">
                    <span>Problemas</span>
                </li>
            </ul>
        </aside>
    </div>

        <div class="conteudo">

            <div class="barra_superior">
                <input type="text" class="busca" placeholder="Pesquisar por L.P">
                <button class="btn btn_filtros">Filtros</button>
                <button class="btn btn_cadastrar">Cadastras</button>
            </div>

            <div class="tabela_card">
                <table>
                    <thead>
                        <tr>
                            <th class="col_icone">Ver</th>
                            <th class="col_icone">Excluir</th>
                            <th>Título</th>
                            <th>Área</th>
                            <th>Categoria</th>
                            <th>Descrição</th>
                        </tr>
                    </thead>
                    
                    <tbody>
                        <tr>
                            <td class="col_icone">
                                <button class="icone_acao">
                                    <img src="assets/empresas/icone_excluir.svg" alt="Excluir">
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
         </div>
    </div>
</body>
</html>
