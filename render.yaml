services:
  - type: web
    name: acta-web
    runtime: docker
    branch: refactor/crud
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: PASSWORD_PEPPER
        sync: false
