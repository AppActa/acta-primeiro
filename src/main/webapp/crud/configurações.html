<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="../assets/images/logo_compacta.svg" type="image/x-icon">
        <link rel="stylesheet" href="../assets/css/crud.css">
        <title>Área Restrita</title>
    </head>
    <body>
        <div class="sistema">
            <aside class="sidebar">
                <div class="sidebar-logo">
                    <img src="../assets/images/logo_oficial.svg" alt="ACTA">
                </div>
                <nav class="menu">
                    <a href="empresa.jsp" class="menu-item">
                        <img src="../assets/images/icone_empresas.svg" alt="">
                        <span>Empresas</span>
                    </a>
                    <a href="endereco.jsp" class="menu-item">
                        <img src="../assets/images/icone_endereco.svg" alt="">
                        <span>Endereço</span>
                    </a>
                    <a href="colaborador.jsp" class="menu-item">
                        <img src="../assets/images/icone_colaborador.svg" alt="">
                        <span>Colaborador</span>
                    </a>
                    <a href="tarefa.jsp" class="menu-item">
                        <img src="../assets/images/icone_tarefa.svg" alt="">
                        <span>Tarefa</span>
                    </a>
                    <a href="planoAcao.jsp" class="menu-item">
                        <img src="../assets/images/icone_plano_de_acao.svg" alt="">
                        <span>Plano de ação</span>
                    </a>
                    <a href="ciclo.jsp" class="menu-item">
                        <img src="../assets/images/icone_ciclos.svg" alt="">
                        <span>Ciclos</span>
                    </a>
                    <a href="licoes-aprendidas.jsp" class="menu-item">
                        <img src="../assets/images/icone_licoes_aprendidas.svg" alt="">
                        <span>Lições Aprendidas</span>
                    </a>
                    <a href="meta.jsp" class="menu-item">
                        <img src="../assets/images/icone_metas.svg" alt="">
                        <span>Metas</span>
                    </a>
                    <a href="problema.jsp" class="menu-item">
                        <img src="../assets/images/icone_problemas.svg" alt="">
                        <span>Problemas</span>
                    </a>
                </nav>
                <div class="perfil-barra">
                    <a href="configurações.html" class="perfil-admin">
                        <div class="perfil-foto">
                            <img src="../assets/images/foto_perfil.svg" alt="Foto de perfil">
                        </div>
                        <div class="perfil-info">
                            <span class="perfil-nome">Daniel de Freitas</span>
                            <span class="perfil-email">danielfrei@gmail.com</span>
                        </div>
                    </a>
                    <a href="login.html" target="_self" class="botao botao-sair">Sair</a>
                </div>
            </aside>

            <main class="conteudo conteudo-config">
                <section class="config">

                    <input type="checkbox" id="config-editar-perfil" class="config-toggle" aria-label="Editar dados">
                    <input type="checkbox" id="config-modal-senha" class="config-toggle" aria-label="Alterar senha">

                    <div class="config-principal">
                        <h1 class="config-titulo">Configurações</h1>

                        <div class="config-foto-area">
                            <div class="config-foto">
                                <img src="../assets/images/foto_perfil.svg" alt="Foto de perfil">

                                <label for="config-editar-perfil" class="config-camera config-camera-modo" aria-label="Editar foto">
                                    <img src="../assets/images/icone_camera.svg" alt="">
                                </label>

                                <label for="config-foto-arquivo" class="config-camera config-camera-arquivo" aria-label="Escolher nova foto">
                                    <img src="../assets/images/icone_camera.svg" alt="">
                                </label>
                                <input type="file" id="config-foto-arquivo" name="foto" form="form-perfil" accept="image/png, image/jpeg, image/webp" hidden>
                            </div>
                        </div>
                    </div>

                    <form class="config-dados" id="form-perfil" method="post" action="#" enctype="multipart/form-data">
                        <div class="config-dados-topo">
                            <h2>Meus dados</h2>

                            <label for="config-editar-perfil" class="botao botao-principal botao-pilula config-dados-editar">Editar</label>

                            <div class="config-dados-botoes">
                                <button type="submit" class="botao botao-principal botao-pilula">Salvar</button>
                                <label for="config-editar-perfil" class="botao botao-cancelar botao-pilula">Cancelar</label>
                            </div>
                        </div>

                        <div class="config-campos">
                            <div class="config-campo">
                                <label for="config-nome" class="config-rotulo">Nome</label>
                                <p class="config-valor editavel">Daniel de Freitas</p>
                                <input type="text" id="config-nome" name="nome" maxlength="50" value="Daniel de Freitas" autocomplete="name" required>
                            </div>

                            <div class="config-campo">
                                <label for="config-email" class="config-rotulo">E-mail</label>
                                <p class="config-valor editavel"><a href="mailto:danielfrei@gmail.com">danielfrei@gmail.com</a></p>
                                <input type="email" id="config-email" name="email" maxlength="80" value="danielfrei@gmail.com" autocomplete="email" required>
                            </div>

                            <div class="config-campo">
                                <label for="config-telefone" class="config-rotulo">Telefone</label>
                                <p class="config-valor editavel">11869345699</p>
                                <input type="tel" id="config-telefone" name="telefone" maxlength="11" pattern="\d{11}" inputmode="numeric" value="11869345699" autocomplete="tel-national" required>
                            </div>

                            <div class="config-campo">
                                <span class="config-rotulo">Senha</span>
                                <p class="config-valor editavel">********</p>
                                <div class="config-senha-acao">
                                    <label for="config-modal-senha" class="botao botao-secundario botao-pilula botao-pilula-sm">Alterar senha</label>
                                </div>
                            </div>
                        </div>
                    </form>

                    <!-- Modal: alterar senha -->
                    <div class="modal-pagina config-modal">
                        <div class="modal-fundo">
                            <label for="config-modal-senha" class="config-modal-fundo-fechar" aria-label="Fechar"></label>
                            <div class="modal">
                                <h2>Alterar senha</h2>
                                <form class="formulario" method="post" action="#">
                                    <div class="campo">
                                        <label for="alt-senha-antiga">Senha antiga</label>
                                        <input type="password" id="alt-senha-antiga" name="senha_antiga" maxlength="100" autocomplete="current-password" placeholder="Digite a senha antiga" required>
                                    </div>
                                    <div class="campo">
                                        <label for="alt-senha-nova">Nova senha</label>
                                        <input type="password" id="alt-senha-nova" name="senha_nova" maxlength="100" autocomplete="new-password" placeholder="Digite a nova senha" required>
                                    </div>
                                    <div class="campo">
                                        <label for="alt-senha-confirmar">Confirmar nova senha</label>
                                        <input type="password" id="alt-senha-confirmar" name="senha_confirmar" maxlength="100" autocomplete="new-password" required>
                                    </div>
                                    <div class="botoes-modal">
                                        <label for="config-modal-senha" class="botao botao-cancelar botao-pilula">Cancelar</label>
                                        <button type="submit" class="botao botao-principal botao-pilula">Confirmar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                </section>
            </main>
        </div>
    </body>
</html>
