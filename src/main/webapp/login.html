<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/images/logo_compacta.svg" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/login.css">
    <title>Login</title>
</head>
<body>
    <main class="login-pagina">
        <div class="login-sair">
            <img src="assets/images/icone_voltar.svg" alt="">
            <a href="#">Tela inicial</a>
        </div>

        <div class="login-cartao">
            <!-- Coluna da esquerda -->
            <aside class="login-visual">
                <img src="assets/images/logo_compacta_escura.svg" alt="" class="login-logo">
                <p class="login-slogan">
                    ACTA, seu app de PDCA
                    <strong>
                        O ciclo de melhoria <br>começa aqui!
                    </strong>
                </p>
            </aside>

            <!-- Coluna da direita -->
            <section class="login-area">
                <h1>Login</h1>
                <p class="login-descricao"> 
                    Junte-se ao ACTA e dê início a um novo ciclo em sua carreira por meio da metodologia PDCA
                </p>

                <form class="login-form" method="post" action="#">
                    <div class="login-campo">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" name="email" maxlength="80" autocomplete="email" required>
                    </div>

                    <div class="login-campo">
                        <label for="login-senha">Senha</label>
                        <input type="password" id="login-senha" class="senha" name="senha" maxlength="100" autocomplete="current-password" required>
                    </div>
                    
                    <button type="submit" class="login-botao">Concluído</button>
                </form>

                <div class="login-divisor"><span>ou</span></div>

                <a href="#" class="login-google">
                    <img src="assets/images/logo_google.svg" alt="">
                    Continuar com Google
                </a>

                <a href="#modal-esqueceu-senha" class="login-esqueceu">Esqueceu sua senha?</a>
            </section>
        </div>

        <!-- Modal "Esqueceu sua senha?" (abre pelo link acima; fecha clicando fora da caixa) -->
        <section id="modal-esqueceu-senha" class="modal-esqueceu-senha">
            <a href="#" class="modal-esqueceu-fundo" aria-label="Fechar"></a>

            <div class="modal-esqueceu-caixa">
                <div class="modal-esqueceu-conteudo">
                    <div class="modal-titulo">
                        <h1>Esqueceu sua senha?</h1>
                        <p class="esqueceu-senha-descricao">Recupere por endereço de email</p>
                    </div>

                    <!-- Tire o atributo "hidden" (ou faça o Servlet tirar) para mostrar o erro -->
                    <p class="login-erro" hidden>email inválido/incorreto*</p>

                    <form class="login-form" method="post" action="#">
                        <div class="login-campo">
                            <label for="esqueceu-email">Email</label>
                            <input type="email" id="esqueceu-email" name="email" maxlength="80" autocomplete="email" required>
                        </div>
                        <button type="submit" class="login-botao">Concluído</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
